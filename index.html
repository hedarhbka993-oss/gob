<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف صوري</title>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; padding: 20px; }
        h1 { color: #4CAF50; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .gallery img { width: 100%; border-radius: 8px; border: 2px solid #333; }
    </style>
</head>
<body>
    <h1>أرشيف صوري</h1>
    <div class="gallery">
        <!-- روابط صور جاهزة من الإنترنت -->
        <img src="https://picsum.photos/300/300?random=1" alt="صورة 1">
        <img src="https://picsum.photos/300/300?random=2" alt="صورة 2">
        <img src="https://picsum.photos/300/300?random=3" alt="صورة 3">
    </div>
</body>
</html>
